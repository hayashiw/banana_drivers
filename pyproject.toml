[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banana_drivers"
version = "0.1.0"
description = "Banana coil optimization drivers for the HBT-EP stellarator-tokamak hybrid"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
banana_drivers = ["inputs/*", "drivers/*.yaml", "scripts/*.sh"]
simsopt_to_vmec = ["inputs/*"]

[project.scripts]
banana-change-parameters = "banana_drivers.scripts.change_parameters:main"
banana-convert-tags = "banana_drivers.scripts.convert_tags:main"
banana-flip-surfacerzfourier = "banana_drivers.scripts.flip_surfacerzfourier:main"
banana-generate-boozersurface-finitebuild = "banana_drivers.scripts.generate_boozersurface_finitebuild:main"
banana-generate-coil-txt-files = "banana_drivers.scripts.generate_coil_txt_files:main"
banana-initialize-boozersurface = "banana_drivers.scripts.initialize_boozersurface:main"
banana-initialize-local = "banana_drivers.scripts.initialize_local:main"
banana-plot-modb-bdotn = "banana_drivers.scripts.plot_modb_bdotn:main"
banana-print-parameters = "banana_drivers.scripts.print_parameters:main"
banana-run-boozer-solve = "banana_drivers.scripts.run_boozer_solve:main"
banana-run-poincare-trace = "banana_drivers.scripts.run_poincare_trace:main"
banana-run-virtual-casing = "banana_drivers.scripts.run_virtual_casing:main"
banana-singlestage-multithread-openblas = "banana_drivers.scripts.singlestage_multithread_openblas:main"
banana-singlestage-multithread = "banana_drivers.scripts.singlestage_multithread:main"
banana-singlestage = "banana_drivers.drivers.singlestage:main"
banana-stage2 = "banana_drivers.drivers.stage2:main"
banana-tabulate-metrics = "banana_drivers.scripts.tabulate_metrics:main"

banana-simsvmec-extract-coefficients = "simsopt_to_vmec.scripts.extract_coefficients:main"
banana-simsvmec-make-input = "simsopt_to_vmec.scripts.make_input:main"